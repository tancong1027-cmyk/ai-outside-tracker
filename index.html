<html lang="zh-CN" class="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 向外 · 投资组合追踪器</title>

    <!-- 防缓存：GitHub Pages 默认让浏览器把页面缓存 10 分钟，
         所以每次改完都要等很久才看得到效果，甚至以为没生效。
         下面这三行让浏览器每次都重新问服务器要最新的文件。
         加 ?v= 版本号的目的是：它一变，浏览器就认为是一个新文件，必须重新下载。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script type="module" crossorigin src="./assets/index-CdU9_qKm.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cx691pXG.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- ============================================================
         选股评分入口（把「投资至简」接进「AI 向外」）
         这是一段独立的脚本，不改动上面那个打包文件。
         ?v=1 是版本号：以后改了这个脚本，把它改成 ?v=2、?v=3，
         浏览器就会立刻重新加载，不会给你看缓存的旧版本。
         要撤销：删掉下面这一行即可，页面回到原样。
         ============================================================ -->
    <script src="./assets/stock-scorer-entry.js?v=2"></script>
  </body>
</html>
